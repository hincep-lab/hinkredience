name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ios:
        description: Spustit i kontrolní sestavení pro iOS
        type: boolean
        default: true
      ocr:
        description: Zkouška čtení receptu z fotky na Android emulátoru
        type: boolean
        default: false
      deploy_mcp:
        description: Nasadit server pro ChatGPT (funkce mcp) – jen po úspěšných testech
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Projekt Supabase „hinkredience“. Veřejný (publishable) klíč není tajný –
# data chrání Row Level Security. Tajné klíče sem nikdy nepatří.
# Secrets SUPABASE_URL a SUPABASE_ANON_KEY mají přednost, pokud jsou nastavené.
env:
  DEFAULT_SUPABASE_URL: https://wjqpzoeheonjwdyyezhb.supabase.co
  DEFAULT_SUPABASE_KEY: sb_publishable_7kKqba-VFfNiKka5RYjGpQ_LpdS-LMl

jobs:
  database:
    name: Databáze – migrace a oprávnění (RLS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testy migrací a Row Level Security
        working-directory: supabase/tests
        run: |
          npm ci
          npm test

  functions:
    name: Serverové funkce – kontrola typů a testy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/sale-ideas/index.ts supabase/functions/ai/index.ts supabase/functions/mcp/index.ts supabase/functions/push/index.ts supabase/functions/prices/index.ts
      - run: deno test supabase/functions

  deploy-mcp:
    name: ChatGPT (MCP) – nasazení serverové funkce
    # Jen na vyžádání a až po úspěšných testech databáze a serverových funkcí.
    # Klíč SUPABASE_ACCESS_TOKEN je jen v GitHub Secrets, nikdy v aplikaci.
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_mcp
    needs: [database, functions]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Nasadit funkci mcp
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Chybí GitHub secret SUPABASE_ACCESS_TOKEN."
            exit 1
          fi
          supabase functions deploy mcp --project-ref wjqpzoeheonjwdyyezhb --no-verify-jwt --use-api --yes

  android:
    name: Aplikace – analýza, testy, APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: SQLite pro testy místní databáze
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev
      - run: flutter pub get
      - name: Formátování
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Statická analýza
        run: flutter analyze --no-fatal-infos
      - name: Testy
        run: flutter test
      - name: Snímky obrazovky pro vizuální kontrolu
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/screenshots
          if-no-files-found: ignore
      - name: Snímky obrazovky do větve screenshots
        if: always() && github.event_name == 'workflow_dispatch' && hashFiles('build/screenshots/*.png') != ''
        working-directory: build/screenshots
        run: |
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Snímky ${{ github.run_number }} (${{ github.sha }})"
          git push -fq "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" screenshots
      - name: Podpisový klíč z GitHub Secrets
        # Klíč není v repozitáři (je veřejný). Secret ANDROID_SIGNING_BUNDLE =
        # base64 archivu s key.properties a hinkredience-release.jks.
        env:
          ANDROID_SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
        run: |
          if [ -z "$ANDROID_SIGNING_BUNDLE" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "Pull request bez přístupu ke klíči – APK jen ladicím klíčem."
              exit 0
            fi
            echo "::error::Chybí GitHub secret ANDROID_SIGNING_BUNDLE (podpisový klíč APK)."
            exit 1
          fi
          tmp=$(mktemp -d)
          printf '%s' "$ANDROID_SIGNING_BUNDLE" | base64 -d | tar xz -C "$tmp"
          mv "$tmp/key.properties" android/key.properties
          mv "$tmp/hinkredience-release.jks" android/app/hinkredience-release.jks
          rm -rf "$tmp"
      - name: Sestavení APK
        run: >
          flutter build apk --release --split-per-abi
          --target-platform android-arm64,android-arm
          --build-number=${{ github.run_number }}
          --dart-define=BUILD_NUMBER=${{ github.run_number }}
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL || env.DEFAULT_SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || env.DEFAULT_SUPABASE_KEY }}
      - name: Přejmenování APK
        # Pro moderní telefony (64bit ARM, např. Galaxy S24) stačí arm64 – je
        # menší a vejde se i na GitHub Pages; starší 32bit telefony mají vlastní.
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk hinkredience.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk hinkredience-32bit.apk
          ls -la hinkredience*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hinkredience-apk
          path: hinkredience.apk
      - name: Vydání ke stažení do telefonu
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: HINKredience° – sestavení ${{ github.run_number }}
          body: |
            Automatické sestavení z commitu ${{ github.sha }}.
            Stáhněte `hinkredience.apk` do telefonu s Androidem a otevřete ho.
          files: |
            hinkredience.apk
            hinkredience-32bit.apk
      - name: Testovací vydání z jiné větve (ruční spuštění)
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: HINKredience° – testovací sestavení ${{ github.run_number }} (${{ github.ref_name }})
          prerelease: true
          body: |
            Testovací sestavení z větve `${{ github.ref_name }}` (commit ${{ github.sha }}), ještě není v `main`.
            Stáhněte `hinkredience.apk` do telefonu s Androidem a otevřete ho.
          files: |
            hinkredience.apk
            hinkredience-32bit.apk

  web:
    name: Web – verze do prohlížeče (Android i iPhone)
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: SQLite (WebAssembly) pro databázi v prohlížeči
        run: dart run sqflite_common_ffi_web:setup
      - name: Sestavení webu
        run: >
          flutter build web --release
          --base-href /hinkredience-login/app/
          --dart-define=BUILD_NUMBER=${{ github.run_number }}
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL || env.DEFAULT_SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || env.DEFAULT_SUPABASE_KEY }}
      - name: Čtení textu z fotky v prohlížeči (Tesseract, čeština)
        run: |
          npm ci --prefix tool/web_ocr --ignore-scripts --no-audit --no-fund
          tool/web_ocr/copy.sh build/web
      - name: APK pro aktualizaci jedním klepnutím
        uses: actions/download-artifact@v4
        with:
          name: hinkredience-apk
          path: build/web
      - name: Informace o nejnovější verzi pro aplikaci
        run: |
          # Kontrolní součet a velikost: aplikace si staženou verzi ověří.
          sha=$(sha256sum build/web/hinkredience.apk | cut -d' ' -f1)
          size=$(stat -c %s build/web/hinkredience.apk)
          printf '{"build": %s, "apk": "hinkredience.apk", "sha256": "%s", "size": %s, "branch": "%s", "commit": "%s"}\n' \
            "${{ github.run_number }}" "$sha" "$size" "${{ github.ref_name }}" "${{ github.sha }}" > build/web/apk.json
          cat build/web/apk.json
      - name: Kontrola – žádné tajné klíče v sestavení
        run: |
          # Tajný klíč Supabase (sb_secret_…), JWT s rolí service_role, klíč OpenAI.
          pattern='sb_secret_[A-Za-z0-9_-]{8,}|eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]*c2VydmljZV9yb2xl|sk-(proj-)?[A-Za-z0-9_-]{32,}'
          if grep -rhoE "$pattern" build/web; then
            echo "Sestavení obsahuje tajný klíč!"; exit 1
          fi
          echo "Výskyty slova service_role (jen text knihoven, žádné klíče):"
          grep -rhoE ".{0,60}service_role.{0,60}" build/web | head -5 || true
      - uses: actions/upload-artifact@v4
        with:
          name: hinkredience-web
          path: build/web
      - name: Uložení sestavení do větve web-build
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        working-directory: build/web
        run: |
          git init -q -b web-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Web ${{ github.run_number }} z ${{ github.ref_name }} (${{ github.sha }})"
          git push -fq "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" web-build

  ocr:
    name: OCR v release sestavení na emulátoru
    if: github.event_name == 'workflow_dispatch' && inputs.ocr
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Uvolnění místa na disku (emulátor potřebuje několik GB)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Sestavení zkušební aplikace (release, x86_64)
        run: >
          flutter build apk --release
          --target-platform android-x64
          -t integration_test/ocr_probe.dart
      - name: Úklid po sestavení
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk ocr-probe.apk
          cp build/app/outputs/mapping/release/mapping.txt ocr-mapping.txt || true
          flutter build apk --profile --target-platform android-x64 -t integration_test/ocr_probe.dart
          cp build/app/outputs/flutter-apk/app-profile.apk ocr-probe-profile.apk
          rm -rf build ~/.gradle/caches/transforms-* ~/.gradle/caches/build-cache-* || true
          df -h /
      - name: Zapnutí KVM pro emulátor
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulátor a zkouška
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r ocr-probe-profile.apk
            adb logcat -c
            adb shell am start -n cz.hink.hinkredience/.MainActivity
            for i in $(seq 1 90); do sleep 2; if adb logcat -d | grep -q "HINK_OCR DONE"; then break; fi; done
            adb logcat -d > logcat-profile.txt || true
            echo "===== PROFILE (bez R8) =====" && grep -E "HINK_OCR" logcat-profile.txt | head -60
            adb uninstall cz.hink.hinkredience || true
            adb install -r ocr-probe.apk
            adb logcat -c
            adb shell am start -n cz.hink.hinkredience/.MainActivity
            for i in $(seq 1 90); do sleep 2; if adb logcat -d | grep -q "HINK_OCR DONE"; then break; fi; done
            adb logcat -d > logcat.txt || true
            echo "===== RELEASE (R8) =====" && grep -E "HINK_OCR" logcat.txt | head -60
            echo "===== NATIVNI ZASOBNIK =====" && grep -A40 "E MethodChannel#google_mlkit_text_recognizer" logcat.txt | head -60 | tee stack.txt
            echo "===== TRIDY ZE ZASOBNIKU PODLE MAPY R8 =====" && for c in $(grep -oE "at [a-z0-9]+\.[<a-z>]+" stack.txt | awk '{print $2}' | cut -d. -f1 | sort -u); do grep -E " -> $c:$" ocr-mapping.txt | head -1; done || true
            echo "===== PO ODSIFROVANI (retrace) =====" && (R=$(ls $ANDROID_HOME/cmdline-tools/*/bin/retrace 2>/dev/null | head -1); if [ -n "$R" ] && [ -f ocr-mapping.txt ]; then sed 's/^.*E MethodChannel#google_mlkit_text_recognizer: //' stack.txt | $R ocr-mapping.txt | head -60; else echo "retrace neni k dispozici"; fi)
            grep -q "HINK_OCR PASS" logcat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocr-logcat
          path: |
            logcat.txt
            logcat-profile.txt
          if-no-files-found: ignore

  ios:
    name: iOS – kontrolní sestavení bez podpisu
    # Běží jen na vyžádání (Run workflow) nebo když zpráva commitu obsahuje [ios];
    # minuty macOS jsou u soukromých repozitářů desetkrát dražší.
    if: (github.event_name == 'workflow_dispatch' && inputs.ios) || contains(github.event.head_commit.message, '[ios]')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
