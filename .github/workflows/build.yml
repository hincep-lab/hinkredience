name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ios:
        description: Spustit i kontrolní sestavení pro iOS
        type: boolean
        default: true

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Projekt Supabase „hinkredience“. Veřejný (publishable) klíč není tajný –
# data chrání Row Level Security. Tajné klíče sem nikdy nepatří.
# Secrets SUPABASE_URL a SUPABASE_ANON_KEY mají přednost, pokud jsou nastavené.
env:
  DEFAULT_SUPABASE_URL: https://wjqpzoeheonjwdyyezhb.supabase.co
  DEFAULT_SUPABASE_KEY: sb_publishable_7kKqba-VFfNiKka5RYjGpQ_LpdS-LMl

jobs:
  database:
    name: Databáze – migrace a oprávnění (RLS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testy migrací a Row Level Security
        working-directory: supabase/tests
        run: |
          npm ci
          npm test

  functions:
    name: Serverové funkce – kontrola typů a testy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/ai/index.ts supabase/functions/mcp/index.ts
      - run: deno test supabase/functions

  android:
    name: Aplikace – analýza, testy, APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: SQLite pro testy místní databáze
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev
      - run: flutter pub get
      - name: Formátování
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Statická analýza
        run: flutter analyze --no-fatal-infos
      - name: Testy
        run: flutter test
      - name: Sestavení APK
        run: >
          flutter build apk --release
          --build-number=${{ github.run_number }}
          --dart-define=BUILD_NUMBER=${{ github.run_number }}
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL || env.DEFAULT_SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || env.DEFAULT_SUPABASE_KEY }}
      - name: Přejmenování APK
        run: cp build/app/outputs/flutter-apk/app-release.apk hinkredience.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hinkredience-apk
          path: hinkredience.apk
      - name: Vydání ke stažení do telefonu
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: HINKredience° – sestavení ${{ github.run_number }}
          body: |
            Automatické sestavení z commitu ${{ github.sha }}.
            Stáhněte `hinkredience.apk` do telefonu s Androidem a otevřete ho.
          files: hinkredience.apk
      - name: Testovací vydání z jiné větve (ruční spuštění)
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: HINKredience° – testovací sestavení ${{ github.run_number }} (${{ github.ref_name }})
          prerelease: true
          body: |
            Testovací sestavení z větve `${{ github.ref_name }}` (commit ${{ github.sha }}), ještě není v `main`.
            Stáhněte `hinkredience.apk` do telefonu s Androidem a otevřete ho.
          files: hinkredience.apk

  web:
    name: Web – verze do prohlížeče (Android i iPhone)
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: SQLite (WebAssembly) pro databázi v prohlížeči
        run: dart run sqflite_common_ffi_web:setup
      - name: Sestavení webu
        run: >
          flutter build web --release
          --base-href /hinkredience-login/app/
          --dart-define=BUILD_NUMBER=${{ github.run_number }}
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL || env.DEFAULT_SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || env.DEFAULT_SUPABASE_KEY }}
      - name: APK pro aktualizaci jedním klepnutím
        uses: actions/download-artifact@v4
        with:
          name: hinkredience-apk
          path: build/web
      - name: Informace o nejnovější verzi pro aplikaci
        run: |
          printf '{"build": %s, "apk": "hinkredience.apk", "branch": "%s", "commit": "%s"}\n' \
            "${{ github.run_number }}" "${{ github.ref_name }}" "${{ github.sha }}" > build/web/apk.json
          cat build/web/apk.json
      - name: Kontrola – žádné tajné klíče v sestavení
        run: |
          # Tajný klíč Supabase (sb_secret_…), JWT s rolí service_role, klíč OpenAI.
          pattern='sb_secret_[A-Za-z0-9_-]{8,}|eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]*c2VydmljZV9yb2xl|sk-(proj-)?[A-Za-z0-9_-]{32,}'
          if grep -rhoE "$pattern" build/web; then
            echo "Sestavení obsahuje tajný klíč!"; exit 1
          fi
          echo "Výskyty slova service_role (jen text knihoven, žádné klíče):"
          grep -rhoE ".{0,60}service_role.{0,60}" build/web | head -5 || true
      - uses: actions/upload-artifact@v4
        with:
          name: hinkredience-web
          path: build/web
      - name: Uložení sestavení do větve web-build
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        working-directory: build/web
        run: |
          git init -q -b web-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Web ${{ github.run_number }} z ${{ github.ref_name }} (${{ github.sha }})"
          git push -fq "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" web-build

  ios:
    name: iOS – kontrolní sestavení bez podpisu
    # Běží jen na vyžádání (Run workflow) nebo když zpráva commitu obsahuje [ios];
    # minuty macOS jsou u soukromých repozitářů desetkrát dražší.
    if: (github.event_name == 'workflow_dispatch' && inputs.ios) || contains(github.event.head_commit.message, '[ios]')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
