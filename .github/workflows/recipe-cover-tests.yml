name: Recipe cover automation safety tests

on:
  pull_request:
    paths:
      - 'tools/recipe_cover_automation.py'
      - 'tests/test_recipe_cover_automation.py'
      - '.github/workflows/recipe-cover-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python -m py_compile tools/recipe_cover_automation.py tests/test_recipe_cover_automation.py
      - name: Unit tests (no API calls)
        run: python -m unittest discover -s tests -p test_recipe_cover_automation.py -v
