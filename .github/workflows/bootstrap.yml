name: bootstrap-deps
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bootstrap.yml']
permissions:
  contents: write
jobs:
  deps:
    runs-on: ubuntu-latest
    env:
      PUB_CACHE: /tmp/pubcache
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: false
      - run: |
          flutter pub add flutter_riverpod go_router supabase_flutter sqflite path path_provider image_picker share_plus uuid shared_preferences collection intl:any dev:sqflite_common_ffi
          flutter pub add flutter_localizations --sdk=flutter
          flutter pub get
      - run: |
          cd /tmp
          tar czf cache.tgz -C /tmp/pubcache hosted
          ls -la cache.tgz
          mkdir out && cd out
          split -b 40m ../cache.tgz part_
          cp "$GITHUB_WORKSPACE/pubspec.yaml" "$GITHUB_WORKSPACE/pubspec.lock" .
          git init -q -b ci-pub-cache
          git config user.name ci && git config user.email ci@example.invalid
          git add . && git commit -q -m "pub cache"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-pub-cache
