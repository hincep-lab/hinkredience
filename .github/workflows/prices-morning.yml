name: Ranní obnovení akcí

# Každé ráno server stáhne aktuální akce sušických obchodů pro zboží
# z nákupních seznamů (letáky, data obchodů, kupi.cz). V aplikaci jsou
# pak hotové bez čekání. Volá serverovou funkci prices s tajným klíčem
# PRICES_CRON_KEY (stejný klíč je v Secrets funkce na Supabase). Bez
# klíče se úloha jen přeskočí.

on:
  schedule:
    # 4:23 UTC = 5:23 v zimě, 6:23 v létě (letáky od pondělí a čtvrtka platí od rána).
    - cron: "23 4 * * *"
  workflow_dispatch:

concurrency:
  group: prices-morning
  cancel-in-progress: false

env:
  DEFAULT_SUPABASE_URL: https://wjqpzoeheonjwdyyezhb.supabase.co

jobs:
  refresh:
    name: Obnovit akce
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Stáhnout akce po dávkách
        env:
          CRON_KEY: ${{ secrets.PRICES_CRON_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          if [ -z "$CRON_KEY" ]; then
            echo "::warning::Chybí secret PRICES_CRON_KEY – ranní obnovení akcí se přeskočí."
            exit 0
          fi
          url="${SUPABASE_URL:-$DEFAULT_SUPABASE_URL}/functions/v1/prices"
          offset=0
          for round in 1 2 3; do
            body=$(curl -sS --max-time 150 -X POST "$url" \
              -H "Content-Type: application/json" \
              -H "x-cron-key: $CRON_KEY" \
              -d "{\"action\":\"scheduled\",\"offset\":$offset}")
            echo "$body" | jq -c '{next, scanned, cached, found, verified, saved, duplicates, errors}' || echo "$body" | head -c 500
            next=$(echo "$body" | jq -r '.next // empty')
            [ -z "$next" ] && break
            offset=$next
          done
