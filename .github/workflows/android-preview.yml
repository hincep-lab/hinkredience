name: Android Preview

on:
  push:
    branches: ['codex/**']

permissions:
  contents: read

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HINKREDIENCE_PREVIEW: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter test --dart-define=HINKREDIENCE_PREVIEW=true test/app_config_test.dart
      - name: Sestavit testovací APK bez produkční konfigurace
        run: >-
          flutter build apk --release --target-platform android-arm64
          --dart-define=HINKREDIENCE_PREVIEW=true
      - name: Ověřit a pojmenovat APK
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -n 1)
          "$aapt" dump badging "$apk" > preview-apk-info.txt
          grep -q "^package: name='cz.hink.hinkredience.preview'" preview-apk-info.txt
          cp "$apk" hinkredience-preview-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hinkredience-preview-arm64
          path: hinkredience-preview-arm64.apk
          if-no-files-found: error
